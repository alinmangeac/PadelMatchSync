services:
  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Auth__SigningKey: ${PAD_MATCH_SIGNING_KEY:?Set PAD_MATCH_SIGNING_KEY to a random secret of at least 32 characters}
      ConnectionStrings__Matches: "Data Source=/data/padel-match-sync.db"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "https://localhost:7001"
      Cors__AllowedOrigins__2: "https://alinmangeac.github.io"
    volumes:
      - padel-data:/data
volumes:
  padel-data:
